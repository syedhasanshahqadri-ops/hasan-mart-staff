<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Panel | Hasan Mart</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("hb_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="top"><span class="logo">Hasan Mart staff</span><nav><button id="th" aria-label="Switch light or dark theme">◐</button><button class="btn sm" id="out" hidden>Sign out</button></nav></header>
<section id="login" class="lg"><h1>Staff sign in</h1><form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button><p class="err" id="le" role="alert"></p></form></section>
<main id="dash" hidden><div class="stats" id="st"></div><div class="tools"><select id="fs" aria-label="Filter by status"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><input id="fq" placeholder="Search by order ID, name, mobile or city"></div><p class="err" id="msg"></p><div id="list"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/app.js"></script></body></html>
